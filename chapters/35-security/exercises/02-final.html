<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Exercise 35-2 · Final</title>
  <link rel="stylesheet" href="../../../assets/style.css">
  <style>
    .trip { inline-size: min(520px, 100%); display: grid; gap: 12px; }
    .trip h1 { margin: 0; font-size: 22px; }
    .trip h2 { margin: 0; font-size: 16px; }
    .trip p { margin: 0; }
    .trip iframe { inline-size: 100%; block-size: 110px; border: 1px solid var(--border); border-radius: 8px; }
    .bars { display: flex; align-items: end; gap: 6px; block-size: 90px; padding: 6px; border: 1px solid var(--border); border-radius: 8px; }
    .bars span { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; }
  </style>
</head>
<body class="demo">
  <main class="trip">
    <h1>Plan your week on the Ridge Loop</h1>
    <h2>Weather</h2>
    <iframe src="02/widget.html" title="Weather on Eagle Ridge" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    <h2>Distance walked each day</h2>
    <div class="bars" data-chart="9,14,6,11,14,3,8" role="img" aria-label="Kilometres walked each day: 9, 14, 6, 11, 14, 3 and 8"></div>
    <p>Photos from last week are on <a href="https://photos.example/ridge-loop" target="_blank">our photo page</a>.</p>
  </main>
  <script src="02/chart.js" integrity="sha384-sp+pjBcc64kgNd2fqVYLdnEM8+kUO+u/C2giwdKk0SYmauPEheH0xHwUaW6bXe6l" crossorigin="anonymous"></script>
</body>
</html>
