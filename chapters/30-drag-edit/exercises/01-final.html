<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 30-1 · Final</title>
  <style>
    .playlist { width: min(420px, 100%); }
    .playlist h2 { margin: 0 0 8px; font-size: 18px; }
    #tracks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; counter-reset: track; }
    #tracks li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: grab; counter-increment: track; }
    #tracks li:last-child { border-bottom: 0; }
    #tracks li::before { content: counter(track); inline-size: 1.4em; font: 13px var(--mono); color: var(--muted); }
    #tracks .title { flex: 1; }
    #tracks li.dragging { opacity: .4; }
    #tracks button { padding: 0 8px; font-size: 13px; }
    #tracks li.over { box-shadow: inset 0 3px 0 var(--accent); }
    #status { margin: 8px 0 0; font-size: 14px; color: var(--muted); min-block-size: 1.4em; }
  </style>
</head>
<body class="demo">
  <section class="playlist" aria-labelledby="p-title">
    <h2 id="p-title">Kind of Blue</h2>
    <ol id="tracks">
      <li draggable="true"><span class="title">Blue in Green</span>
        <button type="button" data-move="-1">↑</button><button type="button" data-move="1">↓</button></li>
      <li draggable="true"><span class="title">So What</span>
        <button type="button" data-move="-1">↑</button><button type="button" data-move="1">↓</button></li>
      <li draggable="true"><span class="title">Freddie Freeloader</span>
        <button type="button" data-move="-1">↑</button><button type="button" data-move="1">↓</button></li>
      <li draggable="true"><span class="title">All Blues</span>
        <button type="button" data-move="-1">↑</button><button type="button" data-move="1">↓</button></li>
      <li draggable="true"><span class="title">Flamenco Sketches</span>
        <button type="button" data-move="-1">↑</button><button type="button" data-move="1">↓</button></li>
    </ol>
    <p id="status" role="status"></p>
  </section>
  <script>
    const tracks = document.getElementById('tracks');
    const status = document.getElementById('status');
    let dragged = null;

    function label() {
      const items = [...tracks.children];
      items.forEach((li, i) => {
        const title = li.querySelector('.title').textContent;
        const [up, down] = li.querySelectorAll('[data-move]');
        up.setAttribute('aria-label', `Move “${title}” up`);
        down.setAttribute('aria-label', `Move “${title}” down`);
        up.disabled = i === 0;
        down.disabled = i === items.length - 1;
      });
    }
    function announce(li) {
      const position = [...tracks.children].indexOf(li) + 1;
      status.textContent = `“${li.querySelector('.title').textContent}” is now track ${position} of ${tracks.children.length}.`;
    }

    tracks.addEventListener('dragstart', (e) => {
      dragged = e.target.closest('li');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragged.querySelector('.title').textContent);
      dragged.classList.add('dragging');
    });
    tracks.addEventListener('dragend', () => {
      dragged?.classList.remove('dragging');
      tracks.querySelector('.over')?.classList.remove('over');
      dragged = null;
    });
    // Without preventDefault() on dragover, the list is not a drop target and drop never fires
    tracks.addEventListener('dragover', (e) => {
      const target = e.target.closest('li');
      if (!dragged || !target) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      tracks.querySelector('.over')?.classList.remove('over');
      if (target !== dragged) target.classList.add('over');
    });
    tracks.addEventListener('drop', (e) => {
      const target = e.target.closest('li');
      if (!dragged || !target) return;
      e.preventDefault();
      if (target !== dragged) target.before(dragged);
      label();
      announce(dragged);
    });

    // The keyboard way to do the same thing
    tracks.addEventListener('click', (e) => {
      const button = e.target.closest('[data-move]');
      if (!button) return;
      const li = button.closest('li');
      if (button.dataset.move === '-1') li.previousElementSibling?.before(li);
      else li.nextElementSibling?.after(li);
      label();
      announce(li);
      const same = li.querySelector(`[data-move="${button.dataset.move}"]`);
      (same.disabled ? li.querySelector('[data-move]:not(:disabled)') : same).focus();
    });

    label();
  </script>
</body>
</html>
