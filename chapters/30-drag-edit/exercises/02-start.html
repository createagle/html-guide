<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 30-2 · Starter</title>
  <style>
    .composer { width: min(460px, 100%); display: grid; gap: 8px; }
    .composer label, .composer .label-text { font-weight: 600; font-size: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .row output, .row .count { font: 13px var(--mono); color: var(--muted); }
    #posts { list-style: none; margin: 14px 0 0; padding: 0; width: min(460px, 100%); display: grid; gap: 8px; }
    #posts li { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; }
    .box { min-block-size: 70px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
  </style>
</head>
<body class="demo">
  <!-- An editable div posing as a text box: no name, no form submission, pasted formatting and markup come along. -->
  <div class="composer">
    <span class="label-text">Your comment</span>
    <div class="box" id="box" contenteditable="true"></div>
    <div class="row">
      <span class="count" id="count">0 / 280</span>
      <button type="button" id="post">Post</button>
    </div>
  </div>
  <ul id="posts"></ul>
  <script>
    const box = document.getElementById('box');
    const count = document.getElementById('count');
    box.addEventListener('input', () => {
      count.textContent = `${box.innerText.length} / 280`;
    });
    document.getElementById('post').addEventListener('click', () => {
      const li = document.createElement('li');
      li.innerHTML = box.innerHTML;
      document.getElementById('posts').prepend(li);
      box.innerHTML = '';
      count.textContent = '0 / 280';
    });
  </script>
</body>
</html>
