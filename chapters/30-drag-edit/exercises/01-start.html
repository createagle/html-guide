<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 30-1 · Starter</title>
  <style>
    .playlist { width: min(420px, 100%); }
    .playlist h2 { margin: 0 0 8px; font-size: 18px; }
    #tracks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; counter-reset: track; }
    #tracks li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: grab; counter-increment: track; }
    #tracks li:last-child { border-bottom: 0; }
    #tracks li::before { content: counter(track); inline-size: 1.4em; font: 13px var(--mono); color: var(--muted); }
    #tracks .title { flex: 1; }
    #tracks li.dragging { opacity: .4; }
  </style>
</head>
<body class="demo">
  <!-- Dragging a track does nothing, and there is no way to reorder with a keyboard. -->
  <section class="playlist" aria-labelledby="p-title">
    <h2 id="p-title">Kind of Blue</h2>
    <ol id="tracks">
      <li draggable="true"><span class="title">Blue in Green</span></li>
      <li draggable="true"><span class="title">So What</span></li>
      <li draggable="true"><span class="title">Freddie Freeloader</span></li>
      <li draggable="true"><span class="title">All Blues</span></li>
      <li draggable="true"><span class="title">Flamenco Sketches</span></li>
    </ol>
  </section>
  <script>
    const tracks = document.getElementById('tracks');
    let dragged = null;

    tracks.addEventListener('dragstart', (e) => {
      dragged = e.target.closest('li');
      dragged.classList.add('dragging');
    });
    tracks.addEventListener('dragend', () => {
      dragged.classList.remove('dragging');
    });
    tracks.addEventListener('drop', (e) => {
      const target = e.target.closest('li');
      if (target && target !== dragged) target.before(dragged);
    });
  </script>
</body>
</html>
