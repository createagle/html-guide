<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 25-1 · Final</title>
  <style>
    .card { width: min(380px, 100%); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; overflow: hidden; position: relative; }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .share-btn { padding: 7px 14px; font-size: 15px; }
    .menu { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 4px; min-inline-size: 190px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
    .menu a { display: block; padding: 7px 10px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 14px; }
    .menu a:hover, .menu a:focus-visible { background: var(--surface); outline: none; }
    /* In the top layer, so the card's overflow no longer clips it; placed under its button */
    .menu { margin: 0; position-area: block-end span-inline-end; margin-block-start: 4px; position-try-fallbacks: flip-block, flip-inline; }
  </style>
</head>
<body class="demo">
  <article class="card">
    <h2>Popovers without JavaScript</h2>
    <p>A short post about the Popover API.</p>
    <button type="button" class="share-btn" popovertarget="menu">Share ▾</button>
    <div class="menu" id="menu" popover>
          <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://example.com/post">LinkedIn</a>
          <a href="https://bsky.app/intent/compose?text=https://example.com/post">Bluesky</a>
          <a href="mailto:?subject=Worth%20reading&amp;body=https://example.com/post">Email</a>
          <a href="https://example.com/post">Copy this link</a>
    </div>
  </article>
</body>
</html>
