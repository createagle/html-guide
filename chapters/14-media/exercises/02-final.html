<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 14-2 · Final</title>
  <style>
    .card { width: min(520px, 100%); border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface); }
    .card h1 { font-size: 18px; margin: 0 0 8px; }
    video { width: 100%; height: auto; border-radius: 6px; background: #000; }
    video::cue { background: rgb(0 0 0 / 0.75); color: #fff; font-family: system-ui, sans-serif; }
    video::cue(v[voice="Guide"]) { color: #ffd84d; }
    video::cue(i) { color: #e3c4ff; }
  </style>
</head>
<body class="demo">
  <article class="card">
    <h1>A day on the ridge</h1>
    <video controls width="640" height="360" poster="../media/poster.jpg" preload="metadata" playsinline>
      <source src="../media/ridge.webm" type='video/webm; codecs="vp9, opus"'>
      <source src="../media/ridge.mp4" type="video/mp4">
      <track kind="captions" src="../media/ridge-en.vtt" srclang="en" label="English">
      <track kind="subtitles" src="02-final.vtt" srclang="fr" label="Français" default>
    </video>
  </article>
</body>
</html>
