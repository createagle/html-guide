<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>33-1 Loading Strategies in a Waterfall</title>
  <style>
    .stage { width: min(860px, 100%); flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 14px; }
    .controls { max-width: 860px; }
    .control select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
    table { inline-size: 100%; border-collapse: collapse; font-size: 13px; }
    caption { text-align: start; }
    th, td { padding: 5px 8px 5px 0; text-align: start; white-space: nowrap; }
    th { font-family: var(--mono); font-weight: 500; }
    td.time { color: var(--muted); font-variant-numeric: tabular-nums; inline-size: 9em; }
    td.track { inline-size: 100%; position: relative; }
    .lane { position: relative; block-size: 14px; margin-block: 3px; background: var(--surface); border-radius: 3px; }
    .seg { position: absolute; inset-block: 0; border-radius: 3px; }
    .seg.connect { background: #f59e0b; }
    .seg.wait { background: color-mix(in srgb, var(--accent) 35%, transparent); }
    .seg.download { background: var(--accent); }
    .seg.run { background: #a855f7; }
    .seg.blocked { inset-block: auto -5px; block-size: 4px; background: var(--bad); }
    .marker { position: absolute; inset-block: -4px; inline-size: 2px; }
    .marker.fcp { background: var(--good); }
    .marker.lcp { background: var(--bad); }
    .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
    .legend span { display: inline-block; inline-size: 12px; block-size: 10px; border-radius: 2px; margin-inline-end: 4px; vertical-align: -1px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0; }
    .metrics div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
    .metrics dt { font-size: 12px; color: var(--muted); }
    .metrics dd { margin: 0; font: 600 20px/1.3 var(--mono); }
    pre.code { font-size: 12px; }
  </style>
</head>
<body class="demo">
  <div class="controls" id="opts">
    <label class="control">Script
      <select id="script">
        <option value="blocking">&lt;script src&gt; in head</option>
        <option value="defer">defer</option>
        <option value="async">async</option>
      </select>
    </label>
    <label class="control">Hero image
      <select id="hero">
        <option value="css">CSS background</option>
        <option value="img">&lt;img&gt;</option>
        <option value="high">&lt;img fetchpriority="high"&gt;</option>
        <option value="lazy">&lt;img loading="lazy"&gt;</option>
        <option value="preload">CSS background + preload</option>
      </select>
    </label>
    <label class="control">Web font
      <select id="font">
        <option value="none">no hint</option>
        <option value="preconnect">preconnect</option>
        <option value="preload">preload</option>
      </select>
    </label>
  </div>
  <div class="stage">
    <dl class="metrics">
      <div><dt>First Contentful Paint</dt><dd id="fcp"></dd></div>
      <div><dt>Largest Contentful Paint</dt><dd id="lcp"></dd></div>
      <div><dt>DOMContentLoaded</dt><dd id="dcl"></dd></div>
      <div><dt>Web font swapped in</dt><dd id="swap"></dd></div>
    </dl>
    <section class="panel">
      <table>
        <caption class="label">Simulated waterfall · 150 ms round trip · numbers are a simplified model</caption>
        <tbody id="rows"></tbody>
        <tfoot aria-hidden="true">
          <tr><td></td><td></td><td><div class="axis"><span>0</span><span>700</span><span>1400</span><span>2100</span><span>2800 ms</span></div></td></tr>
        </tfoot>
      </table>
      <ul class="legend">
        <li><span style="background:#f59e0b"></span>DNS, TCP and TLS</li>
        <li><span style="background:color-mix(in srgb, var(--accent) 35%, transparent)"></span>Waiting for the server</li>
        <li><span style="background:var(--accent)"></span>Downloading</li>
        <li><span style="background:#a855f7"></span>Running script</li>
        <li><span style="background:var(--bad);block-size:4px;vertical-align:2px"></span>Parser blocked</li>
        <li><span style="background:var(--good);inline-size:3px"></span>FCP</li>
        <li><span style="background:var(--bad);inline-size:3px"></span>LCP</li>
      </ul>
    </section>
    <pre class="code" id="markup"></pre>
  </div>
  <script>
    const RTT = 150, CONNECT = 3 * RTT, SCALE = 2800;
    const FOUND = 750; // the preload scanner reads the <head> from the first bytes of HTML

    // A deliberately simple model of one page load: enough to show cause and effect
    function model({ script, hero, font }) {
      const rows = [];
      rows.push(['index.html', [['connect', 0, CONNECT], ['wait', CONNECT, 700], ['download', 700, 800]]]);

      const cssEnd = FOUND + RTT + 400;
      rows.push(['style.css', [['wait', FOUND, FOUND + RTT], ['download', FOUND + RTT, cssEnd]]]);

      // Scripts after a stylesheet wait for it; a classic script also stops the parser
      const jsEnd = FOUND + RTT + 250;
      const run = script === 'async' ? jsEnd : Math.max(jsEnd, cssEnd);
      const js = [['wait', FOUND, FOUND + RTT], ['download', FOUND + RTT, jsEnd], ['run', run, run + 150]];
      if (script === 'blocking') js.push(['blocked', 800, run + 150]);
      rows.push(['app.js', js]);

      const bodyParsed = script === 'blocking' ? run + 150 : 800;
      const fcp = Math.max(cssEnd, bodyParsed) + 50;
      const dcl = script === 'async' ? bodyParsed + 50 : Math.max(bodyParsed, run + 150) + 50;

      // The font is only requested once styled text needs it
      const needFont = Math.max(cssEnd, bodyParsed);
      const connected = font === 'none' ? needFont + CONNECT : FOUND + CONNECT;
      const fontStart = font === 'preload' ? connected : Math.max(needFont, connected);
      const fontEnd = fontStart + RTT + 100;
      rows.push(['fonts.example.com/serif.woff2', [['connect', connected - CONNECT, connected], ['wait', fontStart, fontStart + RTT], ['download', fontStart + RTT, fontEnd]]]);

      // The hero image: when is it discovered, and how much bandwidth does it get?
      const late = Math.max(cssEnd, bodyParsed) + 50; // needs CSS or layout first
      const start = { css: late, lazy: late, img: FOUND, high: FOUND, preload: FOUND }[hero];
      const heroEnd = start + RTT + 800 + (hero === 'img' ? 300 : 0); // a low-priority image shares bandwidth
      rows.push(['hero.jpg', [['wait', start, start + RTT], ['download', start + RTT, heroEnd]]]);

      return { rows, fcp, dcl, lcp: Math.max(fcp, heroEnd + 50), swap: Math.max(fcp, fontEnd) };
    }

    function markup({ script, hero, font }) {
      const head = [];
      if (font === 'preconnect') head.push('<link rel="preconnect" href="https://fonts.example.com" crossorigin>');
      if (font === 'preload') head.push('<link rel="preload" href="https://fonts.example.com/serif.woff2" as="font" type="font/woff2" crossorigin>');
      if (hero === 'preload') head.push('<link rel="preload" href="hero.jpg" as="image" fetchpriority="high">');
      head.push('<link rel="stylesheet" href="style.css">');
      head.push(`<script src="app.js"${script === 'blocking' ? '' : ` ${script}`}></` + 'script>');
      const img = {
        css: '<div class="hero"></div> <!-- background-image: url(hero.jpg) -->',
        preload: '<div class="hero"></div> <!-- background-image: url(hero.jpg) -->',
        img: '<img src="hero.jpg" alt="…" width="1200" height="600">',
        high: '<img src="hero.jpg" alt="…" width="1200" height="600" fetchpriority="high">',
        lazy: '<img src="hero.jpg" alt="…" width="1200" height="600" loading="lazy">',
      }[hero];
      return `<head>\n  ${head.join('\n  ')}\n</head>\n<body>\n  ${img}\n  …\n</body>`;
    }

    function draw() {
      const opts = { script: script.value, hero: hero.value, font: font.value };
      const r = model(opts);
      const pct = (t) => `${(t / SCALE) * 100}%`;
      const rows = document.getElementById('rows');
      rows.replaceChildren(...r.rows.map(([name, parts]) => {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.scope = 'row';
        th.textContent = name;
        const time = document.createElement('td');
        time.className = 'time';
        const from = Math.min(...parts.map((p) => p[1])), to = Math.max(...parts.map((p) => p[2]));
        time.textContent = `${from}–${to} ms`;
        const track = document.createElement('td');
        track.className = 'track';
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.setAttribute('aria-hidden', 'true');
        for (const [kind, a, b] of parts) {
          const seg = document.createElement('span');
          seg.className = `seg ${kind}`;
          seg.style.insetInlineStart = pct(a);
          seg.style.inlineSize = pct(b - a);
          lane.append(seg);
        }
        for (const k of ['fcp', 'lcp']) {
          const m = document.createElement('span');
          m.className = `marker ${k}`;
          m.style.insetInlineStart = pct(r[k]);
          lane.append(m);
        }
        track.append(lane);
        tr.append(th, time, track);
        return tr;
      }));
      for (const k of ['fcp', 'lcp', 'dcl', 'swap']) document.getElementById(k).textContent = `${r[k]} ms`;
      document.getElementById('markup').textContent = markup(opts);
    }
    document.getElementById('opts').addEventListener('change', draw);
    draw();
  </script>
</body>
</html>
