<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../../assets/style.css">
  <title>Ridge Loop trail map</title>
  <style>
    body.demo { padding: 0; min-height: 0; }
    svg { display: block; inline-size: 100%; block-size: auto; }
    .land { fill: #dcefd8; }
    .lake { fill: #a5d8f3; }
    .trail { fill: none; stroke: #c2410c; stroke-width: 4; stroke-dasharray: 10 6; }
    .place { font: 600 14px system-ui, sans-serif; fill: #1c1917; }
    @media (prefers-color-scheme: dark) {
      .land { fill: #23402a; }
      .lake { fill: #1e4f6e; }
      .trail { stroke: #fb923c; }
      .place { fill: #f5f5f4; }
    }
  </style>
</head>
<body class="demo">
  <svg viewBox="0 0 560 315" role="img" aria-labelledby="map-title">
    <title id="map-title">Map of the Ridge Loop: from the north car park up to Eagle Ridge, down to the lake and back</title>
    <rect class="land" width="560" height="315"/>
    <path class="lake" d="M330 200 C360 160 450 170 470 210 S420 290 360 270 S300 240 330 200Z"/>
    <path class="trail" d="M90 250 C120 160 180 90 260 70 S400 80 430 150 S420 230 360 250 S200 280 90 250Z"/>
    <circle cx="90" cy="250" r="8" fill="#16a34a"/>
    <text class="place" x="40" y="285">North car park</text>
    <text class="place" x="220" y="55">Eagle Ridge</text>
    <text class="place" x="385" y="300">Lake path</text>
  </svg>
</body>
</html>
