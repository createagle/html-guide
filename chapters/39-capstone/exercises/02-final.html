<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>39 Exercise 2 · Final</title>
  <style>
    .stage { width: min(520px, 100%); flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
    form { display: grid; gap: 14px; }
    .field { display: grid; gap: 4px; margin: 0; }
    fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px 12px; }
    legend, label { font-weight: 600; }
    .choice { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
    .choice input { margin: 4px 0 0; }
    .hint { margin: 0; font-size: 14px; color: var(--muted); }
    input[type="text"], input[type="email"] { inline-size: 100%; padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
    input:user-invalid { border-color: var(--bad); }
    button { justify-self: start; padding: 8px 18px; border: 0; border-radius: 999px; background: #b4381f; color: #fff; font-weight: 600; cursor: pointer; }
    dialog { inline-size: min(360px, calc(100vw - 32px)); border: 0; border-radius: 12px; padding: 20px; background: var(--surface); color: var(--fg); box-shadow: 0 10px 40px rgb(0 0 0 / .4); }
    dialog::backdrop { background: rgb(0 0 0 / .5); }
    dialog h2 { margin: 0 0 8px; }
    dialog form { display: block; margin-top: 14px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <section class="panel" aria-labelledby="register-h">
      <h2 id="register-h">Register</h2>
      <form id="registration" method="post" action="https://example.org/open-web-day/register">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <p class="hint" id="email-hint">We’ll send your ticket here.</p>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-hint">
        </div>
        <fieldset class="field">
          <legend>How will you attend?</legend>
          <label class="choice"><input type="radio" name="attend" value="in-person" required> <span>In person in Millbrook</span></label>
          <label class="choice"><input type="radio" name="attend" value="online"> <span>Online stream</span></label>
        </fieldset>
        <label class="choice"><input type="checkbox" name="conduct" required> <span>I agree to follow the code of conduct</span></label>
        <button type="submit">Register</button>
      </form>
    </section>
  </div>

  <dialog id="done" aria-labelledby="done-h">
    <h2 id="done-h">You’re registered</h2>
    <p><span id="who"></span>, we’ll see you <span id="how"></span>.</p>
    <form method="dialog"><button type="submit" autofocus>Done</button></form>
  </dialog>

  <script>
    const form = document.getElementById('registration');
    const dialog = document.getElementById('done');

    // submit only fires once every required field is valid
    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(form);
      document.getElementById('who').textContent = data.get('name').trim();
      document.getElementById('how').textContent = data.get('attend') === 'online' ? 'on the stream' : 'in Millbrook';
      dialog.showModal();
    });
    dialog.addEventListener('close', () => form.reset());
  </script>
</body>
</html>
