<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>39 Exercise 1 · Start</title>
  <style>
    .stage { width: min(720px, 100%); flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
    .hero img { display: block; inline-size: 100%; height: auto; border-radius: 14px; }
    .hero h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 16px 0 4px; }
    .hero p { margin: 0; font-size: 1.1rem; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <section class="hero">
      <img src="../01-landing/img/hero-wide-1920.jpg" alt="Hero image" loading="lazy">
      <h1>Open Web Day 2026</h1>
      <p>A free, one-day community conference about building for the web with HTML.</p>
    </section>
    <section class="panel" aria-labelledby="report-h">
      <h2 class="label" id="report-h">What this browser did</h2>
      <dl id="report"></dl>
    </section>
  </div>
  <script src="hero-report.js"></script>
</body>
</html>
