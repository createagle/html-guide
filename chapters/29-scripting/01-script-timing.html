<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>29-1 Script Loading Timeline</title>
  <script>
    // Every script on this page calls mark() when it runs
    const timing = [];
    function mark(name, kind) {
      timing.push({ name, kind, t: performance.now(), state: document.readyState });
    }
    mark('inline <script> in <head>', 'classic');
    document.addEventListener('DOMContentLoaded', () => mark('DOMContentLoaded', 'event'));
    addEventListener('load', () => { mark('load', 'event'); showLog(); });
  </script>
  <script type="importmap">
    { "imports": { "format": "./timing/format.js" } }
  </script>
  <script src="timing/classic.js"></script>
  <script defer src="timing/defer-a.js"></script>
  <script defer src="timing/defer-b.js"></script>
  <script async src="timing/async.js"></script>
  <script type="module" src="timing/module.js"></script>
  <style>
    .stage { width: min(820px, 100%); flex-direction: column; align-items: stretch; gap: 16px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0; padding: 0; list-style: none; }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .sw { inline-size: 22px; block-size: 10px; border-radius: 3px; display: inline-block; }
    .parse { background: var(--border); }
    .fetch { background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 6px); outline: 1px solid var(--accent); outline-offset: -1px; }
    .exec { background: var(--accent); }
    .dcl { inline-size: 2px; block-size: 14px; background: var(--good); }
    .diagram { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; align-items: center; margin: 0; }
    .diagram dt { font: 13px var(--mono); }
    .diagram dd { margin: 0; position: relative; block-size: 30px; }
    .lane { position: absolute; inset-inline: 0; block-size: 10px; }
    .lane.p { inset-block-start: 2px; }
    .lane.s { inset-block-start: 17px; }
    .lane span { position: absolute; block-size: 10px; border-radius: 3px; }
    .diagram dd::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: var(--dcl); inline-size: 2px; background: var(--good); }
    table { border-collapse: collapse; inline-size: 100%; font-size: 13px; }
    th, td { text-align: start; padding: 5px 8px; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    td:nth-child(3) { font-family: var(--mono); text-align: end; }
    .kind { font: 12px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); }
    .kind.event { color: var(--good); border-color: var(--good); }
  </style>
</head>
<body class="demo">
  <div class="controls">
    <button type="button" id="reload">Reload page</button>
  </div>
  <div class="stage">
    <section class="panel" aria-labelledby="d-label">
      <h2 class="label" id="d-label">How each kind of script affects HTML parsing</h2>
      <ul class="legend">
        <li><span class="sw parse"></span> HTML parsing</li>
        <li><span class="sw fetch"></span> Script download</li>
        <li><span class="sw exec"></span> Script runs</li>
        <li><span class="sw dcl"></span> DOMContentLoaded</li>
      </ul>
      <dl class="diagram">
        <dt>&lt;script&gt;</dt>
        <dd style="--dcl: 100%"><span class="lane p"><span class="parse" style="left:0;width:25%"></span><span class="parse" style="left:62%;width:38%"></span></span>
          <span class="lane s"><span class="fetch" style="left:25%;width:25%"></span><span class="exec" style="left:50%;width:12%"></span></span></dd>
        <dt>defer</dt>
        <dd style="--dcl: 87%"><span class="lane p"><span class="parse" style="left:0;width:75%"></span></span>
          <span class="lane s"><span class="fetch" style="left:25%;width:25%"></span><span class="exec" style="left:75%;width:12%"></span></span></dd>
        <dt>async</dt>
        <dd style="--dcl: 87%"><span class="lane p"><span class="parse" style="left:0;width:50%"></span><span class="parse" style="left:62%;width:25%"></span></span>
          <span class="lane s"><span class="fetch" style="left:25%;width:25%"></span><span class="exec" style="left:50%;width:12%"></span></span></dd>
        <dt>type="module"</dt>
        <dd style="--dcl: 87%"><span class="lane p"><span class="parse" style="left:0;width:75%"></span></span>
          <span class="lane s"><span class="fetch" style="left:25%;width:15%"></span><span class="fetch" style="left:42%;width:15%"></span><span class="exec" style="left:75%;width:12%"></span></span></dd>
        <dt>type="module" async</dt>
        <dd style="--dcl: 87%"><span class="lane p"><span class="parse" style="left:0;width:57%"></span><span class="parse" style="left:69%;width:18%"></span></span>
          <span class="lane s"><span class="fetch" style="left:25%;width:15%"></span><span class="fetch" style="left:42%;width:15%"></span><span class="exec" style="left:57%;width:12%"></span></span></dd>
      </dl>
    </section>
    <section class="panel" aria-labelledby="m-label">
      <h2 class="label" id="m-label">Measured on this page load</h2>
      <table>
        <thead><tr><th scope="col">Script or event</th><th scope="col">Kind</th><th scope="col">Time</th><th scope="col">readyState</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>
  <script>mark('inline <script> at end of <body>', 'classic');</script>
  <script>
    document.getElementById('reload').addEventListener('click', () => location.reload());
    function showLog() {
      const rows = timing.map(({ name, kind, t, state }) => {
        const tr = document.createElement('tr');
        for (const text of [name, kind, `${t.toFixed(1)} ms`, state]) tr.insertCell().textContent = text;
        const tag = document.createElement('span');
        tag.className = `kind ${kind}`;
        tag.textContent = kind;
        tr.cells[1].replaceChildren(tag);
        return tr;
      });
      document.getElementById('rows').replaceChildren(...rows);
    }
  </script>
</body>
</html>
