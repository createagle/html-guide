<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>19-2 Password Confirmation and Custom Errors</title>
  <style>
    form { width: min(480px, 100%); display: grid; gap: 14px; }
    .summary { border: 3px solid var(--bad); border-radius: 8px; padding: 12px 14px; }
    .summary h2 { font-size: 16px; margin: 0 0 6px; }
    .summary ul { margin: 0; padding-left: 20px; }
    .summary a { color: var(--bad); font-weight: 600; }
    .field { display: grid; gap: 4px; }
    .field label { font-weight: 600; font-size: 14px; }
    .field input { font-size: 15px; padding: 6px 8px; border: 2px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .field input[aria-invalid="true"] { border-color: var(--bad); }
    .hint { font-size: 12px; color: var(--muted); margin: 0; }
    .error { font-size: 13px; color: var(--bad); margin: 0; font-weight: 600; }
    .error:empty { display: none; }
    button { justify-self: start; padding: 8px 16px; font-size: 15px; }
    #done { margin: 0; color: var(--good); font-weight: 600; }
  </style>
</head>
<body class="demo">
  <form id="form" novalidate>
    <div class="summary" id="summary" tabindex="-1" hidden>
      <h2 id="summary-title">There is a problem</h2>
      <ul id="summary-list"></ul>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <p class="error" id="email-error"></p>
      <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <p class="hint" id="password-hint">At least 10 characters, including a digit</p>
      <p class="error" id="password-error"></p>
      <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password" aria-describedby="password-hint password-error">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <p class="error" id="confirm-error"></p>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password" aria-describedby="confirm-error">
    </div>
    <button type="submit">Create account</button>
    <p id="done" role="status"></p>
  </form>
  <script>
    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');

    // Our own wording for each validity flag, per field
    const messages = {
      email: { valueMissing: 'Enter your email address', typeMismatch: 'Enter an email address in the correct format, like name@example.com' },
      password: { valueMissing: 'Enter a password', tooShort: 'Password must be at least 10 characters', customError: 'Password must include at least one digit' },
      confirm: { valueMissing: 'Confirm your password', customError: 'The passwords do not match' },
    };

    // Rules HTML can't express go through setCustomValidity: empty string means valid
    function customRules() {
      password.setCustomValidity(password.value && !/\d/.test(password.value) ? 'needs a digit' : '');
      confirm.setCustomValidity(confirm.value && confirm.value !== password.value ? 'no match' : '');
    }

    function messageFor(input) {
      const v = input.validity;
      if (v.valid) return '';
      // valueMissing first, so an empty field gets the simplest message
      const order = ['valueMissing', 'typeMismatch', 'tooShort', 'customError'];
      const flag = order.find((f) => v[f]) || Object.keys(messages[input.id])[0];
      return messages[input.id][flag] || input.validationMessage;
    }

    function showField(input) {
      const msg = messageFor(input);
      document.getElementById(input.id + '-error').textContent = msg ? 'Error: ' + msg : '';
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
      return msg;
    }

    [password, confirm].forEach((el) => el.addEventListener('input', () => {
      customRules();
      // once a field has shown an error, keep its message up to date while typing
      if (el.getAttribute('aria-invalid') === 'true') showField(el);
      if (el === password && confirm.getAttribute('aria-invalid') === 'true') showField(confirm);
    }));
    form.querySelectorAll('input').forEach((el) => el.addEventListener('blur', () => { customRules(); if (el.value) showField(el); }));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      customRules();
      const problems = [...form.querySelectorAll('input')].map((el) => [el, showField(el)]).filter(([, msg]) => msg);
      const summary = document.getElementById('summary');
      document.getElementById('done').textContent = '';
      if (problems.length) {
        document.getElementById('summary-list').innerHTML = problems.map(([el, msg]) => `<li><a href="#${el.id}">${msg}</a></li>`).join('');
        summary.hidden = false;
        summary.focus(); // move focus so screen reader users hear the summary
        return;
      }
      summary.hidden = true;
      document.getElementById('done').textContent = 'Account created (in this demo nothing is sent).';
    });
    // Links in the summary focus the field rather than just scrolling to it
    document.getElementById('summary-list').addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      document.querySelector(a.getAttribute('href')).focus();
    });
  </script>
</body>
</html>
