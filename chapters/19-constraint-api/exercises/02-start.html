<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 19-2 · Starter</title>
  <style>
    form { width: min(420px, 100%); display: grid; gap: 12px; }
    .field { display: grid; gap: 4px; }
    .field label { font-weight: 600; font-size: 14px; }
    .field input { font-size: 15px; padding: 6px 8px; border: 2px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
    button { justify-self: start; padding: 8px 16px; font-size: 15px; }
    #done { margin: 0; color: var(--good); font-weight: 600; }

  </style>
</head>
<body class="demo">
  <!-- The browser's bubbles show one vague message at a time, in the browser's language.
       Replace them with your own messages under every field. -->
  <form id="form">
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" required min="18" max="99"></div>
    <button type="submit">Join the club</button>
    <p id="done" role="status"></p>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('done').textContent = 'Welcome! (nothing is sent in this demo)';
    });
  </script>
</body>
</html>
