<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 17-1 · Final</title>
  <style>
    form { width: min(460px, 100%); display: grid; gap: 12px; }
    .field { display: grid; gap: 4px; }
    .field label { font-weight: 600; font-size: 14px; }
    .field input { font-size: 16px; padding: 6px 8px; }
    .field input[type=range] { padding: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { justify-self: start; padding: 8px 16px; font-size: 15px; }
  </style>
</head>
<body class="demo">
  <form action="https://httpbin.org/get">
    <div class="field"><label for="name">Full name</label><input type="text" id="name" name="name" autocomplete="name"></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email"></div>
    <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" autocomplete="tel"></div>
    <div class="row">
      <div class="field"><label for="arrive">Arrival date</label><input type="date" id="arrive" name="arrive" min="2026-01-01" max="2027-12-31"></div>
      <div class="field"><label for="time">Arrival time</label><input type="time" id="time" name="time" min="12:00" max="22:00" step="900"></div>
    </div>
    <div class="field"><label for="nights">Nights (1 to 14)</label><input type="number" id="nights" name="nights" min="1" max="14" value="1"></div>
    <div class="field">
      <label for="budget">Budget per night (€50 to €300)</label>
      <input type="range" id="budget" name="budget" min="50" max="300" step="10" value="150">
      <output id="budget-out" for="budget">€150</output>
    </div>
    <div class="field"><label for="postcode">Postcode</label><input type="text" id="postcode" name="postcode" autocomplete="postal-code"></div>
    <div class="field"><label for="card">Card number</label><input type="text" id="card" name="card" inputmode="numeric" autocomplete="cc-number"></div>
    <button type="submit">Book</button>
  </form>
  <script>
    const budget = document.getElementById('budget');
    budget.addEventListener('input', () => { document.getElementById('budget-out').textContent = '€' + budget.value; });
  </script>
</body>
</html>
