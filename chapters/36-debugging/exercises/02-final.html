<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Newsletter card · Exercise 36-2 (final)</title>
  <style>
    .stage { inline-size: min(440px, 100%); display: block; }
    .card { position: relative; border: 1px solid var(--border); border-radius: 12px; padding: 4px 20px 18px; }
    .close { position: absolute; inset: 10px 10px auto auto; inline-size: 32px; block-size: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface); color: var(--fg); cursor: pointer; }
    h1 { font-size: 1.5rem; margin-block-end: 4px; }
    h2 { font-size: 1.1rem; margin-block: 14px 4px; }
    .hint { color: var(--muted); font-size: 14px; margin-block-start: 0; }
    form { display: grid; gap: 10px; }
    input[type="email"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); }
    .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    .subscribe { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; cursor: pointer; }
    details { font-size: 14px; margin-block-end: 14px; }
    summary { color: var(--accent); cursor: pointer; inline-size: fit-content; }
    details p { margin-block: 6px 0; }
    label[for="email"] { font-size: 14px; font-weight: 600; margin-block-end: -6px; }
    .social { display: flex; gap: 12px; margin-block-start: 14px; }
    .social a { color: var(--muted); }
  </style>
</head>
<body class="demo">
  <main class="stage">
    <section class="card" aria-labelledby="title">
      <button type="button" class="close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <h1 id="title">Trail Notes</h1>
      <p class="hint">One email a month. No spam.</p>
      <h2>What you get</h2>
      <ul>
        <li>New routes near you</li>
        <li>Gear reviews</li>
      </ul>
      <details>
        <summary>Show a sample issue</summary>
        <p>March: three spring loops under 10 km, and how to dry wet boots overnight.</p>
      </details>
      <form action="#subscribed">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        <label class="check"><input type="checkbox" name="terms" required> I agree to the terms</label>
        <button type="submit" class="subscribe">Subscribe</button>
      </form>
      <div class="social">
        <a href="#rss" aria-label="RSS feed"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="16" r="2" fill="currentColor"/><path d="M2 9a9 9 0 0 1 9 9M2 3a15 15 0 0 1 15 15" stroke="currentColor" stroke-width="2.4" fill="none"/></svg></a>
      </div>
    </section>
  </main>
</body>
</html>
