<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>4-2 Fragment Links and :target</title>
  <style>
    body { margin: 0; }
    .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .bar nav a { margin-right: 12px; }
    main { max-width: 560px; padding: 16px 16px 60vh; }
    section { padding: 4px 12px; margin: 0 -12px 24px; border-radius: 8px; transition: background-color .4s; }
    section p { color: var(--muted); }
    section p:nth-child(n+2) { height: 120px; }
    /* :target matches the element whose id equals the URL fragment */
    section:target { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    body.margin section { scroll-margin-top: 64px; }
    body.smooth { scroll-behavior: smooth; }
    html:has(body.smooth) { scroll-behavior: smooth; }
  </style>
</head>
<body class="margin">
  <header class="bar">
    <nav aria-label="Contents">
      <a href="#install">Install</a>
      <a href="#configure">Configure</a>
      <a href="#deploy">Deploy</a>
    </nav>
    <label class="control"><input type="checkbox" id="margin" checked> scroll-margin-top</label>
    <label class="control"><input type="checkbox" id="smooth"> Smooth scrolling</label>
  </header>
  <main>
    <section id="install">
      <h2>Install</h2>
      <p>Download the package and unpack it.</p>
      <p>More text to make the page scroll.</p>
    </section>
    <section id="configure">
      <h2>Configure</h2>
      <p>Edit the settings file.</p>
      <p>More text to make the page scroll.</p>
    </section>
    <section id="deploy">
      <h2>Deploy</h2>
      <p>Upload the files to your server.</p>
      <p>More text to make the page scroll.</p>
    </section>
    <p><a href="#">Back to top</a></p>
  </main>
  <script>
    document.getElementById('margin').addEventListener('change', (e) => document.body.classList.toggle('margin', e.target.checked));
    document.getElementById('smooth').addEventListener('change', (e) => document.body.classList.toggle('smooth', e.target.checked));
  </script>
</body>
</html>
