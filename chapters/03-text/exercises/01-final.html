<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 3-1 · Finished</title>
  <style>
    .panel { width: min(420px, 100%); }
    .panel > :first-child { margin-top: 0; }
    figure { margin: 16px 0 0; padding-left: 16px; border-left: 3px solid var(--border); }
    blockquote { margin: 0; font-style: italic; }
    blockquote p { margin: 0; }
    .stage figcaption { margin-top: 4px; color: var(--muted); text-align: left; font-size: inherit; }
    kbd { padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <div class="panel">
      <p><strong>Warning:</strong> Back up your files before updating.</p>
      <p>To save at any time, press <kbd>Ctrl</kbd>+<kbd>S</kbd>.</p>
      <figure>
        <blockquote>
          <p>Simple things should be simple, complex things should be possible.</p>
        </blockquote>
        <figcaption>— Alan Kay</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
