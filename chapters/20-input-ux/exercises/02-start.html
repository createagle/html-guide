<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 20-2 · Starter</title>
  <style>
    .chat { width: min(460px, 100%); border: 1px solid var(--border); border-radius: 12px; display: grid; grid-template-rows: 1fr auto; height: 420px; overflow: hidden; }
    #log { list-style: none; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    #log li { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--bg); padding: 6px 10px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #log li.them { align-self: flex-start; background: var(--surface); color: var(--fg); border-radius: 12px 12px 12px 2px; }
    form { display: flex; gap: 8px; align-items: end; padding: 10px; border-top: 1px solid var(--border); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #msg { flex: 1; font-size: 15px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 18px; background: var(--bg); color: var(--fg); }
    button { padding: 7px 14px; font-size: 15px; border-radius: 18px; }
  </style>
</head>
<body class="demo">
  <!-- A single-line box: long messages scroll sideways and there is no way to start a new line. -->
  <section class="chat" aria-label="Chat with support">
    <ol id="log" aria-live="polite">
      <li class="them">Hi! How can we help?</li>
    </ol>
    <form id="form">
      <label for="msg" class="visually-hidden">Message</label>
      <input type="text" id="msg" name="msg" autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </section>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const log = document.getElementById('log');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const li = document.createElement('li');
      li.textContent = msg.value;
      log.append(li);
      log.scrollTop = log.scrollHeight;
      msg.value = '';
    });
  </script>
</body>
</html>
