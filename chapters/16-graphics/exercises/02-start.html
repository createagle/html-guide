<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 16-2 · Starter</title>
  <style>
    .card { width: min(420px, 100%); border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface); }
    .card h1 { font-size: 18px; margin: 0 0 8px; }
    .tools { display: flex; gap: 8px; }
    .tools button { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer; }
    .tools button:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body class="demo">
  <!-- The icon buttons have no names, and the icons stay black in dark mode and on hover. -->
  <article class="card">
    <h1>Two days on North Ridge</h1>
    <p>A two-day walk along the crest, with a night at the second saddle.</p>
    <div class="tools">
      <button type="button"><img src="icons/like.svg" width="20" height="20"></button>
      <button type="button"><img src="icons/save.svg" width="20" height="20"></button>
      <button type="button"><img src="icons/share.svg" width="20" height="20"></button>
    </div>
  </article>
</body>
</html>
