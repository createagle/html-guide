<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <style>
    .bar { fill: #2563eb; }
    .axis { stroke: #a8a29e; }
    text { font: 11px system-ui, sans-serif; fill: #57534e; }
    @media (prefers-color-scheme: dark) { .bar { fill: #60a5fa; } text { fill: #d6d3d1; } }
  </style>
  <line class="axis" x1="30" y1="150" x2="290" y2="150"/>
  <g>
    <rect class="bar" x="40" y="114" width="28" height="36"/><text x="54" y="166" text-anchor="middle">Apr</text>
    <rect class="bar" x="82" y="90" width="28" height="60"/><text x="96" y="166" text-anchor="middle">May</text>
    <rect class="bar" x="124" y="42" width="28" height="108"/><text x="138" y="166" text-anchor="middle">Jun</text>
    <rect class="bar" x="166" y="18" width="28" height="132"/><text x="180" y="166" text-anchor="middle">Jul</text>
    <rect class="bar" x="208" y="30" width="28" height="120"/><text x="222" y="166" text-anchor="middle">Aug</text>
    <rect class="bar" x="250" y="78" width="28" height="72"/><text x="264" y="166" text-anchor="middle">Sep</text>
  </g>
</svg>
