<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Product card · Exercise 37-1 (final)</title>
  <style>
    .stage { inline-size: min(420px, 100%); display: grid; gap: 14px; }
    .product { border: 1px solid var(--border); border-radius: 12px; padding: 4px 18px 14px; }
    .product h2 { margin-block-end: 4px; }
    .product h2 a { color: inherit; }
    .price { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--bg); vertical-align: middle; }
    .specs { border-collapse: collapse; margin-block: 10px; }
    .specs th, .specs td { text-align: start; padding: 4px 16px 4px 0; border-block-end: 1px solid var(--border); }
    .stock { margin: 0; font-size: 13px; color: var(--muted); }
    .report { font-size: 14px; }
    .report ul { margin: 6px 0 0; padding-inline-start: 20px; display: grid; gap: 4px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <!-- What the server sent. The script below plays the client: it renders the same component and compares. -->
    <div id="app">
      <article class="product">
        <h2><a href="#tent">Trail Tent 2</a></h2>
        <p class="price">€249 <span class="badge">New</span></p>
        <p><a href="#reviews">4.6 ★ (128 reviews)</a></p>
        <table class="specs">
          <tbody>
            <tr><th scope="row">Weight</th><td>1.9 kg</td></tr>
            <tr><th scope="row">Sleeps</th><td>2</td></tr>
          </tbody>
        </table>
        <p class="stock">In stock · checked at 09:14:07</p>
      </article>
    </div>
    <!-- The values the server used, sent along so the client renders exactly the same thing -->
    <script type="application/json" id="initial-data">{ "checkedAt": "09:14:07" }</script>
    <section class="panel report" aria-labelledby="report-h">
      <h2 class="label" id="report-h">Hydration check</h2>
      <p id="verdict" role="status"></p>
      <ul id="problems"></ul>
    </section>
  </div>
  <script>
    // The component as the client renders it: [tag, attributes, children]
    const { checkedAt } = JSON.parse(document.getElementById('initial-data').textContent);
    const component = ['article', { class: 'product' }, [
      ['h2', {}, [['a', { href: '#tent' }, ['Trail Tent 2']]]],
      ['p', { class: 'price' }, ['€249 ', ['span', { class: 'badge' }, ['New']]]],
      ['p', {}, [['a', { href: '#reviews' }, ['4.6 ★ (128 reviews)']]]],
      ['table', { class: 'specs' }, [
        ['tbody', {}, [
          ['tr', {}, [['th', { scope: 'row' }, ['Weight']], ['td', {}, ['1.9 kg']]]],
          ['tr', {}, [['th', { scope: 'row' }, ['Sleeps']], ['td', {}, ['2']]]],
        ]],
      ]],
      ['p', { class: 'stock' }, [`In stock · checked at ${checkedAt}`]],
    ]];
  </script>
  <script src="hydrate-check.js"></script>
</body>
</html>
