<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 12-2 · Starter</title>
  <style>
    article { width: min(560px, 100%); line-height: 1.7; }
    .meta { font-size: 14px; color: var(--muted); }
    .old { text-decoration: line-through; color: var(--muted); }
    .new { color: var(--good); font-weight: 600; }
  </style>
</head>
<body class="demo">
  <!-- Two different kinds of change are styled the same way here. Use the element that says what each one means. -->
  <article class="panel">
    <h1>Mountain mug</h1>
    <p>Price: <span class="old">£15</span> <span class="new">£12</span> (autumn sale)</p>
    <h2>Corrections</h2>
    <p>This mug holds <span class="old">400 ml</span> <span class="new">350 ml</span>. We measured it again on 7 October 2026 and fixed the listing.</p>
  </article>
</body>
</html>
