<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>26-1 Dialog and Popover Without JavaScript</title>
  <style>
    .stage { width: min(640px, 100%); flex-direction: column; align-items: stretch; }
    .file { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .file strong { flex: 1 1 auto; }
    button { padding: 7px 14px; font-size: 15px; }
    .danger { color: var(--bad); }

    dialog { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--bg); color: var(--fg); inline-size: min(380px, 90vw); }
    dialog h2 { margin: 0 0 8px; font-size: 18px; }
    dialog p { margin: 0 0 14px; }
    dialog::backdrop { background: rgb(0 0 0 / .45); }
    .row { display: flex; gap: 8px; justify-content: flex-end; }
    .x { position: absolute; inset-block-start: 8px; inset-inline-end: 8px; padding: 2px 8px; border: 0; background: none; color: var(--muted); font-size: 18px; }

    #menu { margin: 0; border: 1px solid var(--border); border-radius: 10px; padding: 4px; background: var(--bg); color: var(--fg); min-inline-size: 170px; box-shadow: 0 8px 24px rgb(0 0 0 / .18);
      position-area: block-end span-inline-start; margin-block-start: 6px; position-try-fallbacks: flip-block; }
    #menu a { display: block; padding: 7px 10px; border-radius: 6px; color: inherit; text-decoration: none; font-size: 14px; }
    #menu a:hover, #menu a:focus-visible { background: var(--surface); outline: none; }

    #help { margin: 0; inset: auto 16px 16px auto; border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--bg); color: var(--fg); max-inline-size: 280px; font-size: 14px; }
    #help p { margin: 0 0 10px; }
    .help-row { display: flex; gap: 8px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <div class="file">
      <strong>report-2026.pdf</strong>
      <button type="button" commandfor="menu" command="toggle-popover">More ▾</button>
      <button type="button" class="danger" commandfor="confirm" command="show-modal">Delete…</button>
    </div>
    <div class="help-row">
      <button type="button" commandfor="help" command="show-popover">Show help</button>
      <button type="button" commandfor="help" command="hide-popover">Hide help</button>
    </div>
  </div>

  <div id="menu" popover>
    <a href="#rename">Rename</a>
    <a href="#move">Move to…</a>
    <a href="#download">Download</a>
  </div>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <button type="button" class="x" commandfor="confirm" command="request-close" aria-label="Close">×</button>
    <h2 id="confirm-title">Delete report-2026.pdf?</h2>
    <p>The file moves to the trash for 30 days.</p>
    <div class="row">
      <button type="button" commandfor="confirm" command="close" value="cancel" autofocus>Cancel</button>
      <button type="button" class="danger" commandfor="confirm" command="close" value="delete">Delete</button>
    </div>
  </dialog>

  <div id="help" popover="manual">
    <p>Every button on this page works without a single line of JavaScript.</p>
    <button type="button" commandfor="help" command="hide-popover">Got it</button>
  </div>
</body>
</html>
