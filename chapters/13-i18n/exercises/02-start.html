<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 13-2 · Starter</title>

  <style>
    .card { width: min(420px, 100%); border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface); }
    .card h1 { font-size: 18px; margin: 0 0 8px; }
    .icon { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .card { text-align: left; }
    .card .icon { margin-right: 8px; }
    .card blockquote { margin: 0 0 0 0; border-left: 4px solid var(--accent); padding-left: 12px; }
    .card .price { float: right; font-weight: 600; }
  </style>
</head>
<body class="demo">
  <!-- This Arabic card is laid out with physical CSS. Make it read right to left properly. -->
  <div class="card">
    <h1><span class="icon"></span>مقهى الضوء</h1>
    <p><span class="price">١٢ ر.س</span>قهوة باردة</p>
    <blockquote>أفضل قهوة باردة في المدينة.</blockquote>
  </div>
</body>
</html>
