<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>15-2 Talking to an iframe with postMessage</title>
  <style>
    .stage { width: min(900px, 100%); align-items: stretch; }
    .left { flex: 1 1 340px; display: grid; gap: 10px; align-content: start; }
    .right { flex: 1 1 400px; }
    iframe { width: 100%; height: 160px; border: 2px dashed var(--accent); border-radius: 8px; display: block; transition: height .2s; }
    .chosen { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    #swatch { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: transparent; }
    .controls { justify-content: flex-start; }
    #log { margin: 0; padding-left: 20px; font: 12px/1.6 var(--mono); max-height: 360px; overflow: auto; }
    #log li { margin-bottom: 4px; }
    .tag { font-weight: 600; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <div class="left">
      <div class="controls">
        <span class="control">Send theme
          <button type="button" data-theme="light">light</button>
          <button type="button" data-theme="dark">dark</button>
        </span>
        <label class="control"><input type="checkbox" id="check" checked> Check origin and source</label>
        <button type="button" id="forge">Send a forged message</button>
      </div>
      <iframe id="widget" src="02-widget.html" title="Color picker widget"></iframe>
      <p class="chosen"><span id="swatch"></span> <span id="chosen">The page has not received a color yet.</span></p>
    </div>
    <section class="panel right" aria-labelledby="log-label">
      <h2 class="label" id="log-label">Messages</h2>
      <ol id="log"></ol>
    </section>
  </div>
  <script>
    const widget = document.getElementById('widget');
    const log = document.getElementById('log');
    const check = document.getElementById('check');

    function note(direction, origin, data, verdict) {
      const li = document.createElement('li');
      const cls = verdict === 'accepted' || verdict === 'sent' ? 'good' : 'bad';
      li.innerHTML = `<span class="tag">${direction}</span> ${direction === 'out' ? 'to' : 'from'} <code></code><br><code></code> <span class="${cls}">${verdict}</span>`;
      li.querySelectorAll('code')[0].textContent = origin;
      li.querySelectorAll('code')[1].textContent = JSON.stringify(data);
      log.prepend(li);
    }

    window.addEventListener('message', (e) => {
      // Who sent it? e.origin is set by the browser and can't be faked; e.source is the sending window
      if (check.checked && (e.origin !== location.origin || e.source !== widget.contentWindow)) {
        note('in', e.origin, e.data, 'rejected');
        return;
      }
      note('in', e.origin, e.data, 'accepted');
      const msg = e.data || {};
      if (msg.type === 'pick') {
        document.getElementById('swatch').style.background = msg.color;
        document.getElementById('chosen').textContent = `The widget picked ${msg.name} (${msg.color}).`;
      } else if (msg.type === 'size') {
        widget.style.height = msg.height + 4 + 'px';
      }
    });

    document.querySelectorAll('[data-theme]').forEach((b) => b.addEventListener('click', () => {
      const data = { type: 'theme', value: b.dataset.theme };
      // The second argument says which origin may receive it; never use '*' for anything private
      widget.contentWindow.postMessage(data, location.origin);
      note('out', location.origin, data, 'sent');
    }));

    // A sandboxed frame has the opaque origin "null": it stands in for a page on another site
    document.getElementById('forge').addEventListener('click', () => {
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts');
      f.hidden = true;
      f.srcdoc = `<script>parent.postMessage({ type: 'pick', name: 'Forged black', color: '#000000' }, '*');<\/script>`;
      f.addEventListener('load', () => setTimeout(() => f.remove(), 500));
      document.body.append(f);
    });
  </script>
</body>
</html>
