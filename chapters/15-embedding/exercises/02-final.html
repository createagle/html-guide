<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 15-2 · Final</title>
  <style>
    .card { width: min(520px, 100%); }
    iframe { width: 100%; height: 120px; border: 1px solid var(--border); border-radius: 8px; display: block; }
  </style>
</head>
<body class="demo">
  <div class="card">
    <iframe id="faq" src="02-final-faq.html" title="Trail questions"></iframe>
  </div>
  <script>
    const frame = document.getElementById('faq');
    window.addEventListener('message', (e) => {
      // Accept only our own FAQ frame, and only the message shape we expect
      if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
      const { type, height } = e.data || {};
      if (type !== 'faq-height' || !Number.isFinite(height)) return;
      frame.style.height = Math.min(Math.ceil(height), 2000) + 'px';
    });
  </script>
</body>
</html>
