<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 15-2 · Starter</title>
  <style>
    .card { width: min(520px, 100%); }
    iframe { width: 100%; height: 120px; border: 1px solid var(--border); border-radius: 8px; display: block; }
  </style>
</head>
<body class="demo">
  <!-- The iframe should grow to fit the FAQ, including when a question is opened. It doesn't, and it trusts any message. -->
  <div class="card">
    <iframe id="faq" src="02-start-faq.html" title="Trail questions"></iframe>
  </div>
  <script>
    const frame = document.getElementById('faq');
    window.addEventListener('message', (e) => {
      frame.style.height = e.data.height + 'px';
    });
  </script>
</body>
</html>
