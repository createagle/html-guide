<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 6-2 · Starter</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="demo">
  <!-- Give this table a caption, a real header row, and row headers, so each number can be read with its labels. -->
  <h1 class="label">Monthly rainfall</h1>
  <table>
    <tr><td><b>City</b></td><td class="num"><b>Jan</b></td><td class="num"><b>Feb</b></td><td class="num"><b>Mar</b></td></tr>
    <tr><td><b>Lisbon</b></td><td class="num">100 mm</td><td class="num">96 mm</td><td class="num">58 mm</td></tr>
    <tr><td><b>Oslo</b></td><td class="num">49 mm</td><td class="num">36 mm</td><td class="num">47 mm</td></tr>
    <tr><td><b>Tokyo</b></td><td class="num">60 mm</td><td class="num">56 mm</td><td class="num">118 mm</td></tr>
  </table>
</body>
</html>
