<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 6-2 · Final</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    caption { font-weight: 600; text-align: left; padding-bottom: 8px; }
    thead th { border-bottom: 2px solid var(--fg); }
  </style>
</head>
<body class="demo">
  <table>
    <caption>Monthly rainfall</caption>
    <thead>
      <tr><th scope="col">City</th><th scope="col" class="num">Jan</th><th scope="col" class="num">Feb</th><th scope="col" class="num">Mar</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Lisbon</th><td class="num">100 mm</td><td class="num">96 mm</td><td class="num">58 mm</td></tr>
      <tr><th scope="row">Oslo</th><td class="num">49 mm</td><td class="num">36 mm</td><td class="num">47 mm</td></tr>
      <tr><th scope="row">Tokyo</th><td class="num">60 mm</td><td class="num">56 mm</td><td class="num">118 mm</td></tr>
    </tbody>
  </table>
</body>
</html>
