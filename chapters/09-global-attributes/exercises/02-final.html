<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 9-2 · Final</title>
  <style>
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(460px, 100%); }
    form label { display: grid; gap: 4px; }
    .wide { grid-column: 1 / -1; }
    .help { font-size: 13px; color: var(--muted); margin: 0; }
  </style>
</head>
<body class="demo">
  <form class="panel">
    <label>First name <input type="text" name="given" autocomplete="given-name"></label>
    <label>Last name <input type="text" name="family" autocomplete="family-name"></label>
    <label class="wide">Street <input type="text" name="street" autocomplete="street-address" aria-describedby="street-help"></label>
    <p class="help wide" id="street-help">Use the address on your bank card.</p>
    <button type="submit" class="wide">Continue</button>
  </form>
</body>
</html>
