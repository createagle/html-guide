<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 9-1 · Final</title>
  <style>
    .shop { display: grid; gap: 12px; width: min(420px, 100%); }
    .product { display: flex; justify-content: space-between; align-items: center; }
    .total { font-weight: 600; }
  </style>
</head>
<body class="demo">
  <section class="panel shop">
    <h1 class="label">Basket</h1>
    <div class="product" data-sku="tea-01" data-price-pence="450">Green tea <button type="button" class="add">Add</button></div>
    <div class="product" data-sku="mug-07" data-price-pence="1200">Mountain mug <button type="button" class="add">Add</button></div>
    <p class="total">Total: £<span id="total">0.00</span></p>
    <p id="empty">Your basket is empty.</p>
  </section>
  <script>
    let total = 0;
    for (const btn of document.querySelectorAll('.add')) {
      btn.addEventListener('click', () => {
        // data-price-pence becomes dataset.pricePence
        total += Number(btn.parentElement.dataset.pricePence);
        document.getElementById('total').textContent = (total / 100).toFixed(2);
        document.getElementById('empty').hidden = true;
      });
    }
  </script>
</body>
</html>
