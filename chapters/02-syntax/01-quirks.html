<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/style.css">
  <title>2-1 Standards Mode vs Quirks Mode</title>
  <style>
    .stage figure { width: min(320px, 100%); }
    iframe { width: 100%; height: 150px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    figcaption code { color: var(--fg); }
    .mode { font-weight: 600; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <figure>
      <iframe id="standards" title="Page with a doctype"></iframe>
      <figcaption><code>&lt;!doctype html&gt;</code> · <span class="mode" id="standards-mode"></span></figcaption>
    </figure>
    <figure>
      <iframe id="quirks" title="Page without a doctype"></iframe>
      <figcaption>No doctype · <span class="mode" id="quirks-mode"></span></figcaption>
    </figure>
  </div>
  <script>
    // The same body in both frames. Both declarations are invalid CSS:
    // a length without a unit, and a hex color without "#".
    const body = `<style>
  body { margin: 12px; font: 14px system-ui, sans-serif; color: #1c1917; }
  .box { width: 200; height: 60; background-color: fde68a; border-style: solid; border-color: d97706; border-width: 2; }
</style>
<div class="box">width: 200; background-color: fde68a</div>`;

    for (const [id, prefix] of [['standards', '<!doctype html>\n'], ['quirks', '']]) {
      const frame = document.getElementById(id);
      frame.addEventListener('load', () => {
        // document.compatMode: "CSS1Compat" = standards mode, "BackCompat" = quirks mode
        const mode = frame.contentDocument.compatMode;
        document.getElementById(id + '-mode').textContent =
          mode === 'CSS1Compat' ? 'CSS1Compat (standards)' : 'BackCompat (quirks)';
      });
      // A blob: URL instead of srcdoc: srcdoc documents always use standards mode.
      // It is same-origin, so the parent can read compatMode.
      frame.src = URL.createObjectURL(new Blob([prefix + body], { type: 'text/html' }));
    }
  </script>
</body>
</html>
