<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 1-3 · Starter</title>
</head>
<body class="demo">
  <!-- Move the styling into a <style> element and the behavior into a <script> element. -->
  <div class="stage">
    <p id="note" style="max-width: 320px; padding: 12px 16px; border: 1px solid #93c5fd; border-radius: 8px; background: #eff6ff; color: #1e3a8a;">
      The kitchen closes at 9 pm.
    </p>
    <button type="button" style="padding: 6px 14px;" onclick="document.getElementById('note').hidden = !document.getElementById('note').hidden">
      Show or hide the note
    </button>
  </div>
</body>
</html>
