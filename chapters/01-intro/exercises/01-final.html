<body class="demo">
  <div class="stage">
    <article class="panel">
      <h1>Cucumber Salad</h1>
      <p>Ready in 5 minutes.</p>
      <h2>Ingredients</h2>
      <ul>
        <li>1 cucumber</li>
        <li>1 clove of garlic</li>
        <li>1 tbsp vinegar</li>
      </ul>
      <h2>Steps</h2>
      <ol>
        <li>Smash the cucumber and cut it into pieces.</li>
        <li>Mince the garlic.</li>
        <li>Toss everything with the vinegar.</li>
      </ol>
    </article>
  </div>
</body>
