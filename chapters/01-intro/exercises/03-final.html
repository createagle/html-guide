<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 1-3 · Finished</title>
  <style>
    .note {
      max-width: 320px;
      padding: 12px 16px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
    }
    .toggle { padding: 6px 14px; }
  </style>
</head>
<body class="demo">
  <div class="stage">
    <p class="note" id="note">The kitchen closes at 9 pm.</p>
    <button type="button" class="toggle" id="toggle">Show or hide the note</button>
  </div>
  <script>
    const note = document.getElementById('note');
    document.getElementById('toggle').addEventListener('click', () => {
      note.hidden = !note.hidden;
    });
  </script>
</body>
</html>
