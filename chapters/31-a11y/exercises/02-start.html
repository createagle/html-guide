<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 31-2 · Starter</title>
  <style>
    .shop { width: min(460px, 100%); display: grid; gap: 12px; }
    .bar { display: flex; justify-content: space-between; align-items: center; }
    .bar img { display: block; }
    .cart-link { display: inline-flex; padding: 6px; border-radius: 8px; background: #fff; }
    .product { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: start; }
    .product img { inline-size: 140px; block-size: 140px; border-radius: 10px; }
    .product h1 { margin: 0 0 4px; font-size: 20px; }
    .price { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    .divider { inline-size: 100%; block-size: 12px; }
    .sizes { font-size: 14px; }
    .sizes table { border-collapse: collapse; }
    .sizes th, .sizes td { padding: 3px 10px; border-bottom: 1px solid var(--border); text-align: start; }
    .field { display: grid; gap: 4px; }
    .field input { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .note { color: #b5b5b5; font-size: 14px; margin: 0; }
  </style>
</head>
<body class="demo">
  <!-- Every image has a text alternative problem, the grey note is hard to read, and the email field has no label. -->
  <div class="shop">
    <!-- [html-validate-disable-block wcag/h30, wcag/h37: the missing text alternatives are the point of this exercise] -->
    <div class="bar">
      <a href="#home"><img src="logo.svg" alt="logo.svg" width="160" height="40"></a>
      <a class="cart-link" href="#cart"><img src="cart.svg" alt="" width="24" height="24"></a>
    </div>
    <div class="product">
      <img src="jacket.svg" width="140" height="140">
      <div>
        <h1>Ridge Rain Jacket</h1>
        <p class="price">$129</p>
        <p class="note">Free returns within 30 days. Ships in 2–3 working days.</p>
      </div>
    </div>
    <img class="divider" src="divider.svg" alt="divider">
    <div class="field">
      <input type="email" placeholder="Email me when it is back in stock">
    </div>
  </div>
</body>
</html>
