<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../assets/style.css">
  <title>Exercise 11-1 · Starter</title>
  <style>
    article { width: min(600px, 100%); }
    .byline { font-size: 14px; color: var(--muted); font-weight: 400; margin: 0 0 12px; }
    .small-title { font-size: 1em; }
  </style>
</head>
<body class="demo">
  <!-- The heading levels here were picked for their font size. Rebuild the outline so the levels follow the structure, and let CSS handle the size. -->
  <article class="panel">
    <h1>Café Lumière</h1>
    <h1>Our menu</h1>
    <h5 class="byline">Updated every Monday</h5>
    <h3>Coffee</h3>
    <p>Espresso, flat white, filter of the week.</p>
    <p><strong>Cold drinks</strong></p>
    <p>Cold brew and iced tea from May to September.</p>
    <h3>Food</h3>
    <h6>Breakfast</h6>
    <p>Croissants from 7:30, granola until noon.</p>
    <h6>Lunch</h6>
    <p>Soup and sandwiches.</p>
  </article>
</body>
</html>
